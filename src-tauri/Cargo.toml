[package]
name = "dikte"
version = "0.1.0"
description = "Windows AI Dictation - Local Whisper"
authors = ["dikte"]
edition = "2021"
repository = ""
license = ""

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
cpal = "0.15"
whisper-rs = "0.16"
reqwest = { version = "0.12", features = ["json", "stream"] }

tokio = { version = "1", features = ["full"] }
arboard = "3"
anyhow = "1"
dirs = "5"
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }
tauri-plugin-clipboard-manager = "2"
keyring = { version = "3", optional = false }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
